[project]
name = "prompt-eval-engine"
version = "1.0.0"
description = "Cost-governed prompt evaluation engine on promptfoo: judge calibration, blinded pairwise promotion, pipeline state machine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Alqarni" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
]
dependencies = [
    "anthropic>=0.116",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cross-judge = ["openai>=1.50"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/AlqarniMohammed/prompt-eval-engine"

[project.scripts]
prompt-eval = "src.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is literally named `src` — a known wart, kept on
# purpose: every promptfoo entry file (4 promptfooconfigs, 12 dataset/spec
# YAMLs) references callbacks as file://src/..., and the pipeline state
# machine SHA-pins those file://src/... paths into recorded fingerprints.
# Renaming would churn all of them for zero behavior change.
[tool.hatch.build.targets.wheel]
packages = ["src"]
