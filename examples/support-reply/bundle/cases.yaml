# Binary-tier dataset for the support-reply example — 12 realistic customer
# messages, written the way stressed people actually type. Every case runs
# the four deterministic contracts; the graded tier (see the spec) adds the
# calibrated judge on top.
- description: "damaged tent on arrival, order number given"
  vars:
    promptFile: support-reply.md
    golden: support-reply
    probe: "hi, order 48213 - the tent arrived with a snapped pole and a rip near the door. what now?"
  assert:
    - { type: python, value: "file://contracts.py:acknowledges_customer" }
    - { type: python, value: "file://contracts.py:has_next_step" }
    - { type: python, value: "file://contracts.py:no_internal_leak" }
    - { type: python, value: "file://contracts.py:no_unfilled_template" }

- description: "damage claim but no order number or photo yet"
  vars:
